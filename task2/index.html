<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>京沪高铁站点与里程可视化</title>
  <script src="../echarts.min.js"></script>
  <style>
    :root { color-scheme: light; --ink:#17243a; --muted:#718096; --blue:#2864dc; --line:#e6ebf2; }
    * { box-sizing:border-box; }
    body { margin:0; background:#f4f7fb; color:var(--ink); font:15px/1.55 "Microsoft YaHei", system-ui, sans-serif; }
    .wrap { max-width:1200px; margin:0 auto; padding:28px 22px 40px; }
    header { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom:20px; }
    h1 { margin:0 0 5px; font-size:26px; letter-spacing:.02em; }
    .sub { color:var(--muted); }
    .tag { background:#e7efff; color:#2457bd; border-radius:20px; padding:6px 12px; white-space:nowrap; font-size:13px; }
    .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:16px; }
    .stat,.panel { background:white; border:1px solid var(--line); border-radius:14px; box-shadow:0 5px 20px #17345c0a; }
    .stat { padding:15px 18px; }
    .stat small { display:block; color:var(--muted); margin-bottom:4px; }
    .stat strong { font-size:21px; }
    .panel { padding:18px; }
    .controls { display:flex; flex-wrap:wrap; align-items:end; gap:12px; margin-bottom:12px; }
    label { display:grid; gap:5px; color:#526078; font-size:13px; }
    select,input,button { font:inherit; }
    select,input { min-height:40px; border:1px solid #d7dfeb; background:#fff; border-radius:8px; padding:8px 11px; color:var(--ink); }
    input { width:min(260px, 100%); }
    button { border:0; border-radius:8px; padding:10px 14px; background:var(--blue); color:white; cursor:pointer; }
    button.secondary { background:#edf2fa; color:#30415d; }
    #chart { width:100%; height:380px; }
    .chart-note { color:var(--muted); font-size:13px; margin:0 2px 4px; }
    .detail { margin-top:12px; min-height:84px; background:#f7f9fd; border-radius:10px; padding:13px 15px; display:flex; justify-content:space-between; align-items:center; gap:15px; }
    .detail strong { font-size:17px; }
    .detail .meta { color:var(--muted); font-size:13px; }
    .station-list { display:flex; flex-wrap:wrap; gap:7px; margin-top:13px; }
    .station-list button { padding:6px 9px; background:#f0f4fa; color:#46546b; font-size:12px; border:1px solid #e5eaf2; }
    .station-list button:hover,.station-list button.active { background:#e5efff; border-color:#b7ceff; color:#174db5; }
    .foot { margin:15px 2px 0; color:#7b8799; font-size:12px; }
    .foot a { color:#3869c8; }
    @media(max-width:700px) { .wrap{padding:18px 12px} header{display:block} .tag{display:inline-block;margin-top:9px} h1{font-size:22px} .stats{gap:8px} .stat{padding:12px} .stat strong{font-size:17px} #chart{height:340px} .detail{align-items:flex-start; flex-direction:column} }
  </style>
</head>
<body>
<main class="wrap">
  <header>
    <div>
      <h1>京沪高铁：站点与线路里程</h1>
      <div class="sub">从北京南到上海虹桥，沿线站点按公开里程排序展示</div>
    </div>
    <span class="tag">交通线路交互可视化</span>
  </header>

  <section class="stats" aria-label="线路摘要">
    <div class="stat"><small>线路</small><strong>京沪高速铁路</strong></div>
    <div class="stat"><small>正线长度</small><strong>1,318 km</strong></div>
    <div class="stat"><small>图中站点</small><strong>23 个</strong></div>
  </section>

  <section class="panel">
    <div class="controls">
      <label>出发站
        <select id="from"></select>
      </label>
      <label>到达站
        <select id="to"></select>
      </label>
      <button id="showRange">显示区间</button>
      <label>查找站名
        <input id="search" type="search" placeholder="输入站名，例如：济南西">
      </label>
      <button id="clearSearch" class="secondary">清除查找</button>
    </div>
    <p class="chart-note">点击站点查看所属城市和里程；选择起终点后可突出显示对应区间。此图展示线路位置，不代表具体车次时刻表。</p>
    <div id="chart" role="img" aria-label="京沪高铁站点里程图"></div>
    <div class="detail" id="detail">
      <div><strong>选择一个站点</strong><div class="meta">点击图中站点或下方站名查看详情</div></div>
      <div class="meta" id="rangeInfo">当前区间：北京南 → 上海虹桥</div>
    </div>
    <div class="station-list" id="stationList" aria-label="站点快捷选择"></div>
    <p class="foot">数据说明：图中为京沪高铁主线 23 个站点的示意序列，天津西站经联络线连接，未放在主线里程轴上。里程取公开线路资料的站点里程。来源：<a href="https://static.cninfo.com.cn/finalpage/2020-01-03/1207220128.PDF" target="_blank" rel="noreferrer">京沪高铁招股说明书摘要</a>；<a href="https://www.china-emu.cn/RailRoads/Line/?LineName=%E4%BA%AC%E6%B2%AA%E9%AB%98%E9%80%9F%E9%93%81%E8%B7%AF" target="_blank" rel="noreferrer">线路站点及里程参考</a>。</p>
  </section>
</main>
<script>
  const stations = [
    {name:'北京南', city:'北京', province:'北京市', km:0, hub:true},
    {name:'廊坊', city:'廊坊', province:'河北省', km:60},
    {name:'天津南', city:'天津', province:'天津市', km:122, hub:true},
    {name:'沧州西', city:'沧州', province:'河北省', km:210},
    {name:'德州东', city:'德州', province:'山东省', km:314},
    {name:'济南西', city:'济南', province:'山东省', km:406, hub:true},
    {name:'泰安', city:'泰安', province:'山东省', km:465},
    {name:'曲阜东', city:'曲阜', province:'山东省', km:535},
    {name:'滕州东', city:'滕州', province:'山东省', km:591},
    {name:'枣庄', city:'枣庄', province:'山东省', km:627},
    {name:'徐州东', city:'徐州', province:'江苏省', km:692, hub:true},
    {name:'宿州东', city:'宿州', province:'安徽省', km:760},
    {name:'蚌埠南', city:'蚌埠', province:'安徽省', km:848},
    {name:'定远', city:'定远', province:'安徽省', km:902},
    {name:'滁州', city:'滁州', province:'安徽省', km:964},
    {name:'南京南', city:'南京', province:'江苏省', km:1023, hub:true},
    {name:'镇江南', city:'镇江', province:'江苏省', km:1088},
    {name:'丹阳北', city:'丹阳', province:'江苏省', km:1120},
    {name:'常州北', city:'常州', province:'江苏省', km:1153},
    {name:'无锡东', city:'无锡', province:'江苏省', km:1210},
    {name:'苏州北', city:'苏州', province:'江苏省', km:1237},
    {name:'昆山南', city:'昆山', province:'江苏省', km:1268},
    {name:'上海虹桥', city:'上海', province:'上海市', km:1318, hub:true}
  ];

  const chart = echarts.init(document.getElementById('chart'));
  const from = document.getElementById('from');
  const to = document.getElementById('to');
  const detail = document.getElementById('detail');
  const rangeInfo = document.getElementById('rangeInfo');
  const search = document.getElementById('search');
  let selected = 0;
  let range = [0, stations.length - 1];

  stations.forEach((s, i) => {
    [from, to].forEach(select => {
      const option = document.createElement('option');
      option.value = String(i);
      option.textContent = s.name;
      select.appendChild(option);
    });
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = s.name;
    button.title = s.km + ' km';
    button.addEventListener('click', () => showStation(i));
    document.getElementById('stationList').appendChild(button);
  });
  from.value = '0';
  to.value = String(stations.length - 1);

  function showStation(index) {
    selected = index;
    const s = stations[index];
    detail.querySelector('div').innerHTML = '<strong>' + s.name + '站</strong><div class="meta">' + s.province + ' · ' + s.city + ' · 北京南起 ' + s.km + ' km' + (s.hub ? ' · 重要枢纽站' : '') + '</div>';
    document.querySelectorAll('.station-list button').forEach((b, i) => b.classList.toggle('active', i === index));
    render();
  }

  function render() {
    const lo = stations[Math.min(range[0], range[1])].km;
    const hi = stations[Math.max(range[0], range[1])].km;
    const q = search.value.trim();
    const found = q ? stations.findIndex(s => s.name.includes(q)) : -1;
    const data = stations.map((s, i) => ({
      name:s.name, value:[s.km, 0],
      symbolSize:s.hub ? 15 : 10,
      itemStyle:{color: found === i ? '#ef6b55' : (i >= Math.min(range[0],range[1]) && i <= Math.max(range[0],range[1]) ? '#2864dc' : '#b6c2d3'), borderColor:'#fff', borderWidth:2},
      label:{show:s.hub || found === i, formatter:s.name, position:'top', color:'#34435d', fontSize:12}
    }));
    chart.setOption({
      grid:{left:46,right:24,top:58,bottom:52},
      tooltip:{trigger:'item',formatter:p => {const s=stations[p.dataIndex];return '<b>'+s.name+'站</b><br/>'+s.province+' · '+s.city+'<br/>北京南起 '+s.km+' km';}},
      xAxis:{type:'value',min:0,max:1318,interval:200,name:'距北京南里程（km）',nameLocation:'middle',nameGap:34,axisLine:{lineStyle:{color:'#aab5c5'}},splitLine:{lineStyle:{color:'#edf1f6'}},axisLabel:{color:'#77849a'}},
      yAxis:{type:'value',min:-0.4,max:0.55,show:false},
      series:[
        {type:'line',data:stations.map(s=>[s.km,0]),symbol:'none',lineStyle:{width:5,color:'#d6e1f2'},markArea:{silent:true,itemStyle:{color:'rgba(40,100,220,0.10)'},data:[[{xAxis:lo},{xAxis:hi}]]},z:1},
        {type:'scatter',data:data, z:3, emphasis:{scale:1.4,itemStyle:{shadowBlur:10,shadowColor:'#2864dc66'}}}
      ]
    }, true);
    const a = stations[Math.min(range[0],range[1])], b = stations[Math.max(range[0],range[1])];
    rangeInfo.textContent = '当前区间：' + a.name + ' → ' + b.name + '（约 ' + (b.km-a.km) + ' km）';
  }

  document.getElementById('showRange').addEventListener('click', () => {
    range = [Number(from.value), Number(to.value)];
    render();
  });
  document.getElementById('clearSearch').addEventListener('click', () => {search.value='';render();});
  search.addEventListener('input', render);
  chart.on('click', p => {if (p.seriesType === 'scatter') showStation(p.dataIndex);});
  window.addEventListener('resize', () => chart.resize());
  render();
</script>
</body>
</html>
